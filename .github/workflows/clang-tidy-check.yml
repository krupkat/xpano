name: clang-tidy

on:
  push:
    branches: [ "main" ]
    paths: 
      - "xpano/**"
      - "tests/**"
      - "misc/cmake/**"
      - "CMakeLists.txt"
      - ".clang-tidy"
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read # to fetch code (actions/checkout)

env:
  BUILD_TYPE: Release
  SPDLOG_VERSION: "v1.17.0"

jobs:
  clang-tidy-check:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true
        persist-credentials: false

    - name: Install prerequisites
      run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libopencv-dev libsdl3-dev libexiv2-dev catch2

    - name: Cache spdlog
      uses: actions/cache@v5
      id: cache-spdlog
      with:
        path: spdlog/build/install
        key: ${{runner.os}}-spdlog-${{env.SPDLOG_VERSION}}-${{env.BUILD_TYPE}}-26.04

    # build newer spdlog as ubuntu 26 version of fmtlib is not compatible with clang-22
    # fixed in https://github.com/fmtlib/fmt/issues/4177, fmtlib 11.1.0
    - name: Install spdlog
      if: steps.cache-spdlog.outputs.cache-hit != 'true'
      run: |
        git clone https://github.com/gabime/spdlog.git --depth 1 --branch $SPDLOG_VERSION
        cd spdlog
        cmake -B build \
          -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
          -DCMAKE_INSTALL_PREFIX=build/install
        cmake --build build --target install -j $(nproc)
        cd ..

    - name: Configure CMake
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
          -DCMAKE_INSTALL_PREFIX=install \
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
          -DBUILD_TESTING=ON \
          -Dspdlog_ROOT=`pwd`/spdlog/build/install

    - name: Run clang-tidy
      run: |
        run-clang-tidy-22 `pwd`/xpano `pwd`/tests \
          -p=build \
          -quiet \
          -header-filter=xpano/xpano.*xpano \
          -export-fixes=fixes.yml

    - name: Check clang-tidy results
      run: |
        python -m venv venv
        source venv/bin/activate
        python -m pip install -r misc/scripts/python/requirements.txt
        python misc/scripts/python/check_fixes.py fixes.yml
