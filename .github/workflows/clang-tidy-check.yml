name: clang-tidy

on:
  push:
    branches: [ "main" ]
    paths: 
      - "xpano/**"
      - "tests/**"
      - "misc/cmake/**"
      - "CMakeLists.txt"
      - ".clang-tidy"
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read # to fetch code (actions/checkout)

env:
  BUILD_TYPE: Release

jobs:
  clang-tidy-check:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true

    - name: Install prerequisites
      run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libopencv-dev libsdl2-dev libspdlog-dev libexiv2-dev catch2

    - name: Configure CMake
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
          -DCMAKE_INSTALL_PREFIX=install \
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
          -DBUILD_TESTING=ON

    - name: Run clang-tidy
      run: |
        run-clang-tidy-22 `pwd`/xpano `pwd`/tests \
          -p=build \
          -quiet \
          -header-filter=xpano/xpano.*xpano \
          -export-fixes=fixes.yml

    - name: Check clang-tidy results
      run: |
        python -m venv venv
        source venv/bin/activate
        python -m pip install -r misc/scripts/python/requirements.txt
        python misc/scripts/python/check_fixes.py fixes.yml
